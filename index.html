<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800, initial-scale=1.0">
<title>ChromaSplash v2</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  background: #060610;
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh; overflow: hidden;
}
#wrap {
  position: relative; width: 800px; height: 480px;
  box-shadow:
    0 0 0 2px #1a1a40,
    0 0 40px rgba(255,15,123,.5),
    0 0 80px rgba(0,229,255,.35),
    0 0 160px rgba(0,0,0,.8);
}
canvas {
  display: block; position: absolute; top: 0; left: 0;
  width: 800px; height: 480px;
}
#paintCanvas { z-index: 0; }
#gameCanvas  { z-index: 1; cursor: crosshair; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="paintCanvas"></canvas>
  <canvas id="gameCanvas"></canvas>
</div>
<script>
'use strict';
// ================================================================
//  ChromaSplash v2 — Neon Top-Down Ink Territory Action
// ================================================================

// ── Canvas setup ────────────────────────────────────────────────
const W = 800, H = 480;

const paintCanvas = document.getElementById('paintCanvas');
const pCtx = paintCanvas.getContext('2d');
paintCanvas.width = W; paintCanvas.height = H;

const gameCanvas = document.getElementById('gameCanvas');
const ctx = gameCanvas.getContext('2d');
gameCanvas.width = W; gameCanvas.height = H;

// ── Arena & obstacles ────────────────────────────────────────────
const ARENA = { x: 32, y: 32, w: 736, h: 416 };

const PILLARS = [
  { x: 126, y: 110, w: 68, h: 68 },   // top-left
  { x: 606, y: 110, w: 68, h: 68 },   // top-right
  { x: 126, y: 302, w: 68, h: 68 },   // bottom-left
  { x: 606, y: 302, w: 68, h: 68 },   // bottom-right
  { x: 366, y: 192, w: 68, h: 96 },   // center (tall)
];

function isWall(x, y) {
  if (x < ARENA.x || x > ARENA.x + ARENA.w || y < ARENA.y || y > ARENA.y + ARENA.h) return true;
  for (const p of PILLARS) {
    if (x >= p.x && x <= p.x + p.w && y >= p.y && y <= p.y + p.h) return true;
  }
  return false;
}

// ── Palette (neon city pop) ──────────────────────────────────────
const PAL = {
  A: { main:'#FF0F7B', light:'#FF78B8', dark:'#AA0055', glow:'#FF00FF', faint:'rgba(255,15,123,0.15)' },
  B: { main:'#00E5FF', light:'#80F0FF', dark:'#0099CC', glow:'#00FFFF', faint:'rgba(0,229,255,0.15)' },
  bg:    '#060610',
  arena: '#0C0C22',
  floor: '#0F0F26',
  wall:  '#14142E',
  wallL: '#22224A',
  wallD: '#080818',
  grid:  'rgba(60,60,180,0.06)',
  text:  '#FFFFFF',
  gold:  '#FFD700',
  dim:   'rgba(0,0,0,0.55)',
};

// ── Game constants ───────────────────────────────────────────────
const GAME_SEC         = 180;
const PLAYER_R         = 14;
const PLAYER_SPEED     = 4.2;
const FRICTION         = 0.80;
const MAX_AMMO         = 8;
const AMMO_REGEN_OWN   = 2.5;  // /sec on own ink
const AMMO_REGEN_BASE  = 0.5;  // /sec always
const SHOT_COST        = 1;
const CHARGE_COST      = 3;
const CHARGE_TIME      = 1.3;   // sec to full charge
const PROJ_SPEED       = 12;
const PROJ_SPEED_CHGD  = 9;
const SPLAT_R          = 30;
const SPLAT_R_CHGD     = 70;
const MAX_SPECIAL      = 100;
const SPECIAL_GAIN_HIT = 20;
const SPECIAL_GAIN_PAINT = 0.4;
const MAX_HP           = 3;
const RESPAWN_SEC      = 3;

// Ownership grid (16px tiles)
const OWN_TS   = 16;
const OWN_COLS = Math.ceil(W / OWN_TS);
const OWN_ROWS = Math.ceil(H / OWN_TS);
let tileOwner = Array.from({length: OWN_ROWS}, () => new Uint8Array(OWN_COLS));

// Deferred paint splats
const pendingSplats = [];

// Special ring effects
const specialEffects = [];

// ── Input ────────────────────────────────────────────────────────
const keys = {};
let mouseX = W/2, mouseY = H/2;
let mouseLB = false, mouseRB = false;
let mouseDown = false;

document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','KeyW','KeyS','KeyA','KeyD','KeyE'].includes(e.code)) e.preventDefault();
  if (e.code === 'Space' && (gState === 'title' || gState === 'result')) onSpacePress();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

gameCanvas.addEventListener('mousemove', e => {
  const r = gameCanvas.getBoundingClientRect();
  mouseX = (e.clientX - r.left) * (W / r.width);
  mouseY = (e.clientY - r.top)  * (H / r.height);
});
gameCanvas.addEventListener('mousedown', e => {
  if (e.button === 0) mouseLB = true;
  if (e.button === 2) mouseRB = true;
});
gameCanvas.addEventListener('mouseup', e => {
  if (e.button === 0) mouseLB = false;
  if (e.button === 2) mouseRB = false;
});
gameCanvas.addEventListener('contextmenu', e => e.preventDefault());

// ── Audio ────────────────────────────────────────────────────────
let aCtx = null;
let bgmGain = null;
let bgmActive = false;

function getAC() {
  if (!aCtx) aCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (aCtx.state === 'suspended') aCtx.resume().catch(()=>{});
  return aCtx;
}

function sfx(type, team) {
  try {
    const ac = getAC();
    const out = ac.createGain();
    out.gain.value = 0.14;
    out.connect(ac.destination);
    const now = ac.currentTime;

    if (type === 'shoot') {
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = 'square';
      o.frequency.setValueAtTime(team==='A' ? 700 : 550, now);
      o.frequency.exponentialRampToValueAtTime(team==='A' ? 250 : 200, now+0.10);
      g.gain.setValueAtTime(1, now); g.gain.exponentialRampToValueAtTime(0.001, now+0.12);
      o.connect(g); g.connect(out); o.start(now); o.stop(now+0.13);
    } else if (type === 'chargeShoot') {
      [0,7,12].forEach((n,i) => {
        const o = ac.createOscillator(); const g = ac.createGain();
        o.type = 'sawtooth';
        o.frequency.value = (team==='A'?300:220) * Math.pow(2, n/12);
        g.gain.setValueAtTime(0, now+i*0.04);
        g.gain.linearRampToValueAtTime(0.5, now+i*0.04+0.02);
        g.gain.exponentialRampToValueAtTime(0.001, now+i*0.04+0.18);
        o.connect(g); g.connect(out); o.start(now+i*0.04); o.stop(now+i*0.04+0.2);
      });
    } else if (type === 'splat') {
      const buf = ac.createBuffer(1, ac.sampleRate*0.18, ac.sampleRate);
      const d = buf.getChannelData(0);
      for (let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.8);
      const src = ac.createBufferSource(); src.buffer = buf;
      const flt = ac.createBiquadFilter(); flt.type='bandpass'; flt.frequency.value=team==='A'?900:700; flt.Q.value=0.6;
      src.connect(flt); flt.connect(out); src.start(now);
    } else if (type === 'bigSplat') {
      const buf = ac.createBuffer(1, ac.sampleRate*0.3, ac.sampleRate);
      const d = buf.getChannelData(0);
      for (let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.2);
      const src = ac.createBufferSource(); src.buffer = buf;
      const flt = ac.createBiquadFilter(); flt.type='lowpass'; flt.frequency.value=500;
      const g2 = ac.createGain(); g2.gain.value=0.8;
      src.connect(flt); flt.connect(g2); g2.connect(out); src.start(now);
    } else if (type === 'special') {
      const dur = 0.6;
      const o = ac.createOscillator(); const g = ac.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(200, now);
      o.frequency.exponentialRampToValueAtTime(1200, now+dur*0.5);
      o.frequency.exponentialRampToValueAtTime(80, now+dur);
      g.gain.setValueAtTime(0.6, now); g.gain.exponentialRampToValueAtTime(0.001, now+dur);
      o.connect(g); g.connect(out); o.start(now); o.stop(now+dur);
      out.gain.value = 0.3;
    } else if (type === 'hit') {
      const o = ac.createOscillator(); const g = ac.createGain();
      o.type = 'triangle'; o.frequency.setValueAtTime(150, now);
      o.frequency.exponentialRampToValueAtTime(50, now+0.15);
      g.gain.setValueAtTime(0.8, now); g.gain.exponentialRampToValueAtTime(0.001, now+0.2);
      o.connect(g); g.connect(out); o.start(now); o.stop(now+0.2);
    } else if (type === 'win') {
      [0,4,7,12,16].forEach((n,i) => {
        const o=ac.createOscillator(); const g=ac.createGain();
        o.frequency.value = 440*Math.pow(2,n/12);
        o.type='triangle';
        g.gain.setValueAtTime(0,now+i*0.09);
        g.gain.linearRampToValueAtTime(0.4,now+i*0.09+0.05);
        g.gain.exponentialRampToValueAtTime(0.001,now+i*0.09+0.6);
        o.connect(g); g.connect(out); o.start(now+i*0.09); o.stop(now+i*0.09+0.7);
      });
      out.gain.value=0.3;
    } else if (type === 'charge') {
      const o = ac.createOscillator(); const g = ac.createGain();
      o.type='sine'; o.frequency.setValueAtTime(300, now);
      o.frequency.linearRampToValueAtTime(team==='A'?800:600, now+CHARGE_TIME);
      g.gain.setValueAtTime(0.05, now); g.gain.linearRampToValueAtTime(0.25, now+CHARGE_TIME);
      o.connect(g); g.connect(out); o.start(now); o.stop(now+CHARGE_TIME+0.1);
      return o; // return so we can stop early
    }
  } catch(e) {}
  return null;
}

function startBGM() {
  if (bgmActive) return;
  bgmActive = true;
  try {
    const ac = getAC();
    bgmGain = ac.createGain();
    bgmGain.gain.value = 0.065;
    bgmGain.connect(ac.destination);

    const BPM = 114, beat = 60/BPM, bars = 4, loop = bars*4*beat;

    // Chord prog: Cmaj7 → Am7 → Fmaj7 → G7 (bright city pop)
    const chords = [
      [60,64,67,71],  // Cmaj7
      [57,60,64,67],  // Am7
      [65,69,72,76],  // Fmaj7
      [67,71,74,77],  // G7
    ];
    const noteFreq = n => 440*Math.pow(2,(n-69)/12);

    function scheduleLoop(t0) {
      chords.forEach((ch, ci) => {
        const cs = t0 + ci*beat*4;
        // Chord stab (short, rhythmic)
        [0, beat*1.5, beat*2.5].forEach(offset => {
          ch.forEach(midi => {
            const o=ac.createOscillator(); const g=ac.createGain();
            o.type='triangle'; o.frequency.value=noteFreq(midi-12);
            const st=cs+offset;
            g.gain.setValueAtTime(0,st); g.gain.linearRampToValueAtTime(0.12,st+0.02);
            g.gain.setValueAtTime(0.10,st+0.18); g.gain.linearRampToValueAtTime(0,st+0.22);
            o.connect(g); g.connect(bgmGain); o.start(st); o.stop(st+0.25);
          });
        });

        // Bass note
        const bass = ch[0] - 12;
        [0, beat*2].forEach(offset => {
          const o=ac.createOscillator(); const g=ac.createGain();
          o.type='sine'; o.frequency.value=noteFreq(bass);
          const st=cs+offset;
          g.gain.setValueAtTime(0.3,st); g.gain.exponentialRampToValueAtTime(0.001,st+beat*1.8);
          o.connect(g); g.connect(bgmGain); o.start(st); o.stop(st+beat*2);
        });

        // Drums every bar
        for(let b=0;b<8;b++) {
          const t=cs+b*beat*0.5;
          // Hi-hat
          const hbuf=ac.createBuffer(1,ac.sampleRate*0.04,ac.sampleRate);
          const hd=hbuf.getChannelData(0);
          for(let i=0;i<hd.length;i++) hd[i]=(Math.random()*2-1)*(1-i/hd.length);
          const hs=ac.createBufferSource(); hs.buffer=hbuf;
          const hf=ac.createBiquadFilter(); hf.type='highpass'; hf.frequency.value=9000;
          const hg=ac.createGain(); hg.gain.value=b%2===0?0.25:0.12;
          hs.connect(hf); hf.connect(hg); hg.connect(bgmGain); hs.start(t); hs.stop(t+0.04);
        }
        // Kick
        { const o=ac.createOscillator(); const g=ac.createGain();
          o.frequency.setValueAtTime(160,cs); o.frequency.exponentialRampToValueAtTime(40,cs+0.1);
          g.gain.setValueAtTime(0.9,cs); g.gain.exponentialRampToValueAtTime(0.001,cs+0.18);
          o.connect(g); g.connect(bgmGain); o.start(cs); o.stop(cs+0.2); }
        // Snare
        { const t=cs+beat*2;
          const buf=ac.createBuffer(1,ac.sampleRate*0.12,ac.sampleRate);
          const d=buf.getChannelData(0);
          for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.4);
          const src=ac.createBufferSource(); src.buffer=buf;
          const g=ac.createGain(); g.gain.value=0.6;
          src.connect(g); g.connect(bgmGain); src.start(t); src.stop(t+0.13); }
        // Open hi-hat on 3.5
        { const t=cs+beat*3.5;
          const buf=ac.createBuffer(1,ac.sampleRate*0.12,ac.sampleRate);
          const d=buf.getChannelData(0);
          for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length)*0.7;
          const src=ac.createBufferSource(); src.buffer=buf;
          const flt=ac.createBiquadFilter(); flt.type='highpass'; flt.frequency.value=7000;
          const g=ac.createGain(); g.gain.value=0.35;
          src.connect(flt); flt.connect(g); g.connect(bgmGain); src.start(t); src.stop(t+0.13); }
      });
    }

    let nextT = ac.currentTime;
    function tick() {
      if (!bgmGain) return;
      while (nextT < ac.currentTime + 0.5) {
        scheduleLoop(nextT);
        nextT += loop;
      }
      setTimeout(tick, 200);
    }
    tick();
  } catch(e) {}
}

function stopBGM() {
  bgmActive = false;
  if (bgmGain) {
    try { bgmGain.gain.linearRampToValueAtTime(0, getAC().currentTime + 0.4); } catch(e){}
    bgmGain = null;
  }
}

// ── Paint system ─────────────────────────────────────────────────
function paintCircle(x, y, team, r) {
  if (r < 1) return;
  const col = PAL[team].main;
  const lit = PAL[team].light;
  const glw = PAL[team].glow;

  // Outer glow halo
  const grad = pCtx.createRadialGradient(x, y, r*0.2, x, y, r*1.4);
  grad.addColorStop(0,   col);
  grad.addColorStop(0.55, col + 'CC');
  grad.addColorStop(0.85, glw + '44');
  grad.addColorStop(1,   glw + '00');
  pCtx.fillStyle = grad;
  pCtx.beginPath(); pCtx.arc(x, y, r*1.4, 0, Math.PI*2); pCtx.fill();

  // Core
  pCtx.fillStyle = col;
  pCtx.beginPath(); pCtx.arc(x, y, r, 0, Math.PI*2); pCtx.fill();

  // Highlight
  pCtx.fillStyle = lit + 'AA';
  pCtx.beginPath(); pCtx.arc(x - r*0.28, y - r*0.28, r*0.42, 0, Math.PI*2); pCtx.fill();
  pCtx.fillStyle = 'rgba(255,255,255,0.55)';
  pCtx.beginPath(); pCtx.arc(x - r*0.38, y - r*0.38, r*0.15, 0, Math.PI*2); pCtx.fill();

  // Irregular edge blobs
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI*2 + Math.random();
    const d = r * (0.55 + Math.random() * 0.35);
    const br = r * (0.12 + Math.random() * 0.2);
    pCtx.fillStyle = col + 'CC';
    pCtx.beginPath(); pCtx.arc(x + Math.cos(a)*d, y + Math.sin(a)*d, br, 0, Math.PI*2); pCtx.fill();
  }

  // Tile ownership
  const tTeam = team === 'A' ? 1 : 2;
  const tr = Math.ceil((r * 1.4) / OWN_TS) + 1;
  const cx = Math.floor(x / OWN_TS), cy = Math.floor(y / OWN_TS);
  let newTiles = 0;
  for (let dr = -tr; dr <= tr; dr++) {
    for (let dc = -tr; dc <= tr; dc++) {
      const col2 = cx + dc, row = cy + dr;
      if (col2 < 0 || col2 >= OWN_COLS || row < 0 || row >= OWN_ROWS) continue;
      const tx = col2 * OWN_TS + OWN_TS/2, ty = row * OWN_TS + OWN_TS/2;
      if (Math.hypot(tx-x, ty-y) < r * 1.1 && !isWall(tx, ty)) {
        if (tileOwner[row][col2] !== tTeam) newTiles++;
        tileOwner[row][col2] = tTeam;
      }
    }
  }
  return newTiles;
}

function triggerSplat(x, y, team, r, depth = 0) {
  const newTiles = paintCircle(x, y, team, r) || 0;

  // Primary splatter → secondary drops
  if (depth === 0) {
    const count = 10 + Math.floor(Math.random() * 6);
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const dist  = r * (0.4 + Math.random() * 0.9);
      const subR  = r * (0.15 + Math.random() * 0.22);
      pendingSplats.push({
        x: x + Math.cos(angle) * dist,
        y: y + Math.sin(angle) * dist,
        team, r: subR,
        timer: 0.04 + Math.random() * 0.09,
        depth: 1,
      });
    }
  } else if (depth === 1 && r > 8) {
    // Secondary drops → tiny tertiary
    const count = 2 + Math.floor(Math.random() * 3);
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      pendingSplats.push({
        x: x + Math.cos(angle) * r * 1.2,
        y: y + Math.sin(angle) * r * 1.2,
        team, r: r * (0.3 + Math.random() * 0.3),
        timer: 0.03 + Math.random() * 0.06,
        depth: 2,
      });
    }
  }
  return newTiles;
}

function updateSplats(dt) {
  for (let i = pendingSplats.length - 1; i >= 0; i--) {
    const s = pendingSplats[i];
    s.timer -= dt;
    if (s.timer <= 0) {
      const ns = pendingSplats.splice(i, 1)[0];
      if (!isWall(ns.x, ns.y)) {
        paintCircle(ns.x, ns.y, ns.team, ns.r);
        spawnInkParticles(ns.x, ns.y, ns.team, ns.depth === 1 ? 4 : 2);
      }
    }
  }
}

function updateSpecialEffects(dt) {
  for (let i = specialEffects.length - 1; i >= 0; i--) {
    const e = specialEffects[i];
    e.r  += e.speed * dt;
    e.r2 += e.speed * dt * 1.4;
    e.alpha -= dt * e.fadeRate;
    if (e.alpha <= 0) specialEffects.splice(i, 1);
  }
}

function getPaintPercents() {
  let total = 0, a = 0, b = 0;
  for (let row = 0; row < OWN_ROWS; row++) {
    for (let col = 0; col < OWN_COLS; col++) {
      const cx = col * OWN_TS + OWN_TS/2, cy = row * OWN_TS + OWN_TS/2;
      if (isWall(cx, cy)) continue;
      total++;
      if (tileOwner[row][col] === 1) a++;
      else if (tileOwner[row][col] === 2) b++;
    }
  }
  if (!total) return { a: 0, b: 0 };
  return { a: a/total*100, b: b/total*100 };
}

function getOwnerAt(x, y) {
  const col = Math.floor(x / OWN_TS), row = Math.floor(y / OWN_TS);
  if (col < 0 || col >= OWN_COLS || row < 0 || row >= OWN_ROWS) return 0;
  return tileOwner[row][col];
}

// ── Particles ─────────────────────────────────────────────────────
const particles = [];

function spawnInkParticles(x, y, team, count) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI*2;
    const spd = 1.5 + Math.random() * 4.5;
    particles.push({
      x, y,
      vx: Math.cos(a)*spd, vy: Math.sin(a)*spd,
      r: 2 + Math.random()*4,
      color: Math.random() < 0.6 ? PAL[team].main : PAL[team].light,
      glow: PAL[team].glow,
      life: 0.4 + Math.random()*0.4,
      maxLife: 0.8,
      friction: 0.92,
    });
    particles[particles.length-1].maxLife = particles[particles.length-1].life;
  }
}

function spawnHitParticles(x, y, team) {
  for (let i = 0; i < 12; i++) {
    const a = Math.random() * Math.PI*2;
    const spd = 2 + Math.random() * 6;
    particles.push({
      x, y,
      vx: Math.cos(a)*spd, vy: Math.sin(a)*spd,
      r: 3 + Math.random()*5,
      color: PAL[team].light,
      glow: PAL[team].glow,
      life: 0.5 + Math.random()*0.3,
      maxLife: 0.8,
      friction: 0.88,
    });
    particles[particles.length-1].maxLife = particles[particles.length-1].life;
  }
}

function spawnConfetti(x, y, count) {
  const cols = [PAL.A.main, PAL.B.main, PAL.gold, PAL.A.light, PAL.B.light, '#fff'];
  for (let i = 0; i < count; i++) {
    const a = -Math.PI/2 + (Math.random()-0.5) * Math.PI;
    const spd = 3 + Math.random() * 8;
    particles.push({
      x, y, vx: Math.cos(a)*spd, vy: Math.sin(a)*spd,
      r: 3 + Math.random()*5,
      color: cols[Math.floor(Math.random()*cols.length)],
      glow: null,
      life: 1.5 + Math.random(), maxLife: 0,
      friction: 0.97, gravity: 0.08,
      rot: Math.random()*Math.PI*2, rotV: (Math.random()-0.5)*0.4,
      square: true,
    });
    particles[particles.length-1].maxLife = particles[particles.length-1].life;
  }
}

function updateParticles(dt) {
  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    p.vx *= p.friction; p.vy *= p.friction;
    if (p.gravity) p.vy += p.gravity;
    p.x += p.vx; p.y += p.vy;
    if (p.rot !== undefined) p.rot += p.rotV;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// ── Projectile ────────────────────────────────────────────────────
const projectiles = [];

class Projectile {
  constructor(x, y, angle, team, charged = false) {
    this.x = x; this.y = y;
    const spd = charged ? PROJ_SPEED_CHGD : PROJ_SPEED;
    this.vx = Math.cos(angle) * spd;
    this.vy = Math.sin(angle) * spd;
    this.team = team;
    this.charged = charged;
    this.r = charged ? 11 : 6;
    this.splatR = charged ? SPLAT_R_CHGD : SPLAT_R;
    this.dead = false;
    this.trail = [];
    this.life = 4; // seconds max
  }

  update(dt, players) {
    this.life -= dt;
    if (this.life <= 0) { this.dead = true; return; }

    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > 10) this.trail.shift();

    this.x += this.vx;
    this.y += this.vy;

    // Bounce off walls
    if (this.x < ARENA.x + this.r || this.x > ARENA.x + ARENA.w - this.r) {
      this.vx *= -0.7;
      this.x = Math.max(ARENA.x + this.r, Math.min(ARENA.x + ARENA.w - this.r, this.x));
    }
    if (this.y < ARENA.y + this.r || this.y > ARENA.y + ARENA.h - this.r) {
      this.vy *= -0.7;
      this.y = Math.max(ARENA.y + this.r, Math.min(ARENA.y + ARENA.h - this.r, this.y));
    }

    // Pillar collision
    for (const p of PILLARS) {
      const cx = Math.max(p.x, Math.min(this.x, p.x + p.w));
      const cy = Math.max(p.y, Math.min(this.y, p.y + p.h));
      const dx = this.x - cx, dy = this.y - cy;
      const dist = Math.hypot(dx, dy);
      if (dist < this.r) {
        this.land();
        return;
      }
    }

    // Player hit
    for (const pl of players) {
      if (pl.dead || pl.team === this.team || pl.respawnFlash > 0) continue;
      if (Math.hypot(this.x - pl.x, this.y - pl.y) < PLAYER_R + this.r) {
        pl.takeHit(this.team);
        this.land(true);
        return;
      }
    }
  }

  land(hitPlayer = false) {
    const newTiles = triggerSplat(this.x, this.y, this.team, this.splatR);
    spawnInkParticles(this.x, this.y, this.team, this.charged ? 20 : 10);
    sfx(this.charged ? 'bigSplat' : 'splat', this.team);
    this.dead = true;
    return newTiles;
  }

  draw() {
    const c = PAL[this.team];
    // Trail
    for (let i = 0; i < this.trail.length; i++) {
      const t = this.trail[i];
      const a = (i / this.trail.length);
      ctx.save();
      ctx.globalAlpha = a * 0.6;
      ctx.fillStyle = c.light;
      ctx.shadowColor = c.glow;
      ctx.shadowBlur = 8;
      const tr = this.r * a * 0.8;
      ctx.beginPath(); ctx.arc(t.x, t.y, tr, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
    // Main blob
    ctx.save();
    ctx.shadowColor = c.glow;
    ctx.shadowBlur = this.charged ? 30 : 15;
    ctx.fillStyle = c.light;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = c.main;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r * 0.6, 0, Math.PI*2); ctx.fill();
    if (this.charged) {
      ctx.globalAlpha = 0.4;
      ctx.fillStyle = c.glow;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.r * 1.8, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

// ── Player ────────────────────────────────────────────────────────
class Player {
  constructor(x, y, team, isAI = false) {
    this.x = x; this.y = y;
    this.vx = 0; this.vy = 0;
    this.team = team;
    this.isAI = isAI;

    // Facing angle (radians, 0 = right)
    this.angle = team === 'A' ? 0 : Math.PI;
    this.targetAngle = this.angle;

    // Ammo (fair: same max for both)
    this.ammo = MAX_AMMO;
    this.shotCooldown = 0;

    // Charge
    this.charging = false;
    this.chargeLevel = 0;
    this.chargeOsc = null;

    // Special
    this.specialMeter = 0;
    this.specialCooldown = 0;

    // HP & respawn
    this.hp = MAX_HP;
    this.dead = false;
    this.respawnTimer = 0;
    this.respawnFlash = 0;   // brief flash after respawn
    this.hitFlash = 0;

    this.respawnX = x; this.respawnY = y;

    // Animation
    this.animTime = 0;
    this.speed = 0;

    // AI state
    this.aiTimer = 0;
    this.aiTarget = { x: W/2, y: H/2 };
    this.aiShootTimer = 0;
    this.aiChargeTimer = 0;
    this.aiCharging = false;
    this.aiChargeDur = 0;
  }

  update(dt, opponent) {
    this.animTime += dt;
    this.hitFlash = Math.max(0, this.hitFlash - dt);
    this.respawnFlash = Math.max(0, this.respawnFlash - dt);
    this.shotCooldown = Math.max(0, this.shotCooldown - dt);
    this.specialCooldown = Math.max(0, this.specialCooldown - dt);
    this.aiTimer = Math.max(0, this.aiTimer - dt);
    this.aiShootTimer = Math.max(0, this.aiShootTimer - dt);

    if (this.dead) {
      this.respawnTimer -= dt;
      if (this.respawnTimer <= 0) { this.respawn(); }
      return;
    }

    // Ammo regen
    const ownOwner = this.team === 'A' ? 1 : 2;
    const standing = getOwnerAt(this.x, this.y);
    const regen = standing === ownOwner ? AMMO_REGEN_OWN : AMMO_REGEN_BASE;
    this.ammo = Math.min(MAX_AMMO, this.ammo + regen * dt);

    // Special cooldown
    if (this.specialCooldown <= 0) {
      this.specialMeter = Math.min(MAX_SPECIAL, this.specialMeter + 2 * dt);
    }

    // Speed modifier
    const enemyOwner = this.team === 'A' ? 2 : 1;
    let speedMult = 1;
    if (standing === enemyOwner) speedMult = 0.5;
    else if (standing === ownOwner) speedMult = 1.25;

    let ax = 0, ay = 0;
    let wantShoot = false, wantSpecial = false, wantRelease = false;
    let aimAngle = this.angle;

    if (this.isAI) {
      [ax, ay, wantShoot, wantRelease, wantSpecial, aimAngle] = this.aiLogic(opponent, dt);
    } else {
      if (keys['KeyA']) ax -= 1;
      if (keys['KeyD']) ax += 1;
      if (keys['KeyW']) ay -= 1;
      if (keys['KeyS']) ay += 1;
      if (ax !== 0 || ay !== 0) {
        const len = Math.hypot(ax, ay);
        ax /= len; ay /= len;
      }

      // Aim toward mouse
      aimAngle = Math.atan2(mouseY - this.y, mouseX - this.x);
      wantShoot   = mouseLB;
      wantSpecial = mouseRB || keys['KeyE'];
      wantRelease = !mouseLB; // release = mouse up
    }

    // Apply movement
    this.vx += ax * PLAYER_SPEED * speedMult * 0.7;
    this.vy += ay * PLAYER_SPEED * speedMult * 0.7;
    this.vx *= FRICTION;
    this.vy *= FRICTION;
    this.speed = Math.hypot(this.vx, this.vy);

    this.x += this.vx;
    this.y += this.vy;

    // Smooth angle rotation
    this.targetAngle = aimAngle;
    let da = this.targetAngle - this.angle;
    while (da > Math.PI) da -= Math.PI*2;
    while (da < -Math.PI) da += Math.PI*2;
    this.angle += da * 0.18;

    // Collision
    this.resolveCollision();

    // Charge mechanic
    if (wantShoot && this.ammo >= CHARGE_COST && this.shotCooldown <= 0) {
      if (!this.charging) {
        this.charging = true;
        this.chargeLevel = 0;
        if (!this.isAI) this.chargeOsc = sfx('charge', this.team);
      }
      this.chargeLevel = Math.min(1, this.chargeLevel + dt / CHARGE_TIME);
    }

    if (wantRelease && this.charging) {
      this.releaseShot(aimAngle);
    }

    // Special
    if (wantSpecial && this.specialMeter >= MAX_SPECIAL && this.specialCooldown <= 0) {
      this.activateSpecial();
    }
  }

  releaseShot(angle) {
    const charged = this.chargeLevel >= 0.85;
    if (this.chargeOsc) { try { this.chargeOsc.stop(); } catch(e){} this.chargeOsc = null; }
    this.charging = false;

    const cost = charged ? CHARGE_COST : SHOT_COST;
    if (this.ammo < cost) { this.chargeLevel = 0; return; }
    this.ammo -= cost;
    this.shotCooldown = charged ? 0.55 : 0.18;

    const ox = this.x + Math.cos(this.angle) * (PLAYER_R + 14);
    const oy = this.y + Math.sin(this.angle) * (PLAYER_R + 14);
    projectiles.push(new Projectile(ox, oy, this.angle, this.team, charged));
    sfx(charged ? 'chargeShoot' : 'shoot', this.team);
    this.chargeLevel = 0;
  }

  activateSpecial() {
    this.specialMeter = 0;
    this.specialCooldown = 6;

    sfx('special', this.team);

    // Paint ring burst
    const bigR = 95;
    triggerSplat(this.x, this.y, this.team, bigR);

    // Ring of secondary splats
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI*2;
      const d = 80 + Math.random() * 30;
      pendingSplats.push({
        x: this.x + Math.cos(a)*d, y: this.y + Math.sin(a)*d,
        team: this.team, r: 25 + Math.random()*15,
        timer: 0.05 + i * 0.035, depth: 1,
      });
    }

    // Visual ring effect
    specialEffects.push({
      x: this.x, y: this.y, team: this.team,
      r: PLAYER_R, r2: PLAYER_R * 0.3,
      alpha: 1, speed: 350, fadeRate: 1.2,
    });
    specialEffects.push({
      x: this.x, y: this.y, team: this.team,
      r: PLAYER_R, r2: 0,
      alpha: 0.7, speed: 220, fadeRate: 0.9,
    });

    spawnInkParticles(this.x, this.y, this.team, 30);
  }

  takeHit(fromTeam) {
    this.hp--;
    this.hitFlash = 0.25;
    sfx('hit');
    spawnHitParticles(this.x, this.y, this.team);
    if (this.hp <= 0) {
      this.die();
    }
  }

  die() {
    this.dead = true;
    this.respawnTimer = RESPAWN_SEC;
    // Explosion of ink
    for (let i = 0; i < 6; i++) {
      const a = (i/6)*Math.PI*2;
      pendingSplats.push({
        x: this.x + Math.cos(a)*20, y: this.y + Math.sin(a)*20,
        team: this.team, r: 18, timer: i*0.04, depth: 2,
      });
    }
    // Opponent gains special
    // (handled in game loop via return value or global ref)
  }

  respawn() {
    this.dead = false;
    this.hp = MAX_HP;
    this.x = this.respawnX; this.y = this.respawnY;
    this.vx = 0; this.vy = 0;
    this.ammo = MAX_AMMO * 0.5;
    this.respawnFlash = 1.5; // invincibility blink
    paintCircle(this.x, this.y, this.team, 35);
  }

  resolveCollision() {
    // Arena bounds
    const m = PLAYER_R;
    this.x = Math.max(ARENA.x + m, Math.min(ARENA.x + ARENA.w - m, this.x));
    this.y = Math.max(ARENA.y + m, Math.min(ARENA.y + ARENA.h - m, this.y));

    // Pillars
    for (const p of PILLARS) {
      const cx2 = Math.max(p.x, Math.min(this.x, p.x + p.w));
      const cy2 = Math.max(p.y, Math.min(this.y, p.y + p.h));
      const dx = this.x - cx2, dy = this.y - cy2;
      const dist = Math.hypot(dx, dy);
      if (dist < m && dist > 0) {
        const push = m - dist;
        this.x += (dx/dist) * push;
        this.y += (dy/dist) * push;
        // Dampen velocity in push direction
        const dot = this.vx*(dx/dist) + this.vy*(dy/dist);
        if (dot < 0) {
          this.vx -= dot*(dx/dist)*1.2;
          this.vy -= dot*(dy/dist)*1.2;
        }
      }
    }
  }

  // ── AI logic ──────────────────────────────────────────────────
  aiLogic(opponent, dt) {
    let ax = 0, ay = 0;
    let wantShoot = false, wantRelease = false, wantSpecial = false;
    let aimAngle = this.angle;

    // Retarget periodically
    if (this.aiTimer <= 0) {
      this.aiTimer = 0.6 + Math.random() * 1.0;
      this.aiTarget = this.aiPickTarget(opponent);
    }

    const tx = this.aiTarget.x, ty = this.aiTarget.y;
    const dist = Math.hypot(tx - this.x, ty - this.y);

    if (dist > 25) {
      ax = (tx - this.x) / dist;
      ay = (ty - this.y) / dist;
    }

    // Avoid pillars & walls predictively
    const nextX = this.x + this.vx * 5 + ax * 20;
    const nextY = this.y + this.vy * 5 + ay * 20;
    if (isWall(nextX, nextY)) {
      ax += (Math.random()-0.5) * 2;
      ay += (Math.random()-0.5) * 2;
    }

    // Aim
    if (opponent && !opponent.dead) {
      aimAngle = Math.atan2(opponent.y - this.y, opponent.x - this.x);
    } else {
      const target = this.aiPickUnpaintedTile();
      if (target) aimAngle = Math.atan2(target.y - this.y, target.x - this.x);
    }

    // Shooting / charging
    this.aiShootTimer -= dt;
    if (this.aiShootTimer <= 0 && this.ammo >= SHOT_COST && this.shotCooldown <= 0) {
      this.aiShootTimer = 0.3 + Math.random() * 0.5;

      // 25% chance to charge
      if (Math.random() < 0.25 && this.ammo >= CHARGE_COST) {
        if (!this.aiCharging) {
          this.aiCharging = true;
          this.aiChargeDur = CHARGE_TIME * (0.7 + Math.random() * 0.4);
          this.charging = true;
          this.chargeLevel = 0;
        }
        wantShoot = true;
        this.aiChargeDur -= dt;
        if (this.aiChargeDur <= 0) {
          this.aiCharging = false;
          wantRelease = true;
          wantShoot = false;
        }
      } else {
        wantShoot = true;
        wantRelease = true; // single shot
      }
    }

    // Special
    if (this.specialMeter >= MAX_SPECIAL && this.specialCooldown <= 0 && Math.random() < 0.02) {
      wantSpecial = true;
    }

    return [ax, ay, wantShoot, wantRelease, wantSpecial, aimAngle];
  }

  aiPickTarget(opponent) {
    // 30% chase opponent, 70% go paint
    if (opponent && !opponent.dead && Math.random() < 0.3) {
      return { x: opponent.x + (Math.random()-0.5)*60, y: opponent.y + (Math.random()-0.5)*60 };
    }
    const t = this.aiPickUnpaintedTile();
    return t || { x: ARENA.x + Math.random()*ARENA.w, y: ARENA.y + Math.random()*ARENA.h };
  }

  aiPickUnpaintedTile() {
    const ownOwner = this.team === 'A' ? 1 : 2;
    let best = null, bestScore = -Infinity;
    // Sample random tiles
    for (let attempt = 0; attempt < 30; attempt++) {
      const col = Math.floor(Math.random() * OWN_COLS);
      const row = Math.floor(Math.random() * OWN_ROWS);
      const cx2 = col * OWN_TS + OWN_TS/2, cy = row * OWN_TS + OWN_TS/2;
      if (isWall(cx2, cy)) continue;
      if (tileOwner[row][col] === ownOwner) continue;
      const d = Math.hypot(cx2 - this.x, cy - this.y);
      const score = (tileOwner[row][col] === 0 ? 20 : 80) - d * 0.05 + Math.random()*15;
      if (score > bestScore) { bestScore = score; best = { x: cx2, y: cy }; }
    }
    return best;
  }

  // ── Drawing ────────────────────────────────────────────────────
  draw() {
    if (this.dead) {
      // Respawn countdown bubble
      const t = RESPAWN_SEC - this.respawnTimer;
      ctx.save();
      ctx.globalAlpha = 0.6;
      ctx.fillStyle = PAL[this.team].main;
      ctx.font = `bold ${18 + Math.sin(t*4)*2}px monospace`;
      ctx.textAlign = 'center';
      ctx.fillText(Math.ceil(this.respawnTimer) + '…', this.respawnX, this.respawnY);
      ctx.restore();
      return;
    }

    // Respawn blink
    if (this.respawnFlash > 0 && Math.floor(this.respawnFlash * 8) % 2 === 0) return;

    const px = this.x, py = this.y;
    const c = PAL[this.team];
    const t = this.animTime;
    const moving = this.speed > 0.5;
    const charge = this.chargeLevel;

    ctx.save();
    ctx.translate(px, py);

    // Hit flash
    if (this.hitFlash > 0) {
      ctx.shadowColor = '#FFFFFF';
      ctx.shadowBlur = 30;
    }

    // Shadow (not rotated)
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(3, 5, 16, 10, this.angle * 0.3, 0, Math.PI*2);
    ctx.fill();

    ctx.rotate(this.angle);

    // Walk bob
    const bob = moving ? Math.sin(t * 18) * 1.5 : 0;
    ctx.translate(0, bob);

    const R = 13;

    // Charge aura (behind everything)
    if (charge > 0.15) {
      const pulseR = R + 5 + charge * 10 + Math.sin(t * 12) * 2;
      const grad = ctx.createRadialGradient(0, 0, R, 0, 0, pulseR);
      grad.addColorStop(0, c.glow + Math.floor(charge * 180).toString(16).padStart(2,'0'));
      grad.addColorStop(1, c.glow + '00');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(0, 0, pulseR, 0, Math.PI*2); ctx.fill();
    }

    // Ink tank (back)
    ctx.fillStyle = c.dark;
    ctx.beginPath(); ctx.ellipse(-R*0.7, 0, R*0.5, R*0.45, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.beginPath(); ctx.arc(-R*0.82, -R*0.18, R*0.18, 0, Math.PI*2); ctx.fill();

    // Body outline (dark)
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath(); ctx.arc(0.6, 0.6, R+1, 0, Math.PI*2); ctx.fill();

    // Body main
    const bGrad = ctx.createRadialGradient(-3, -3, 2, 0, 0, R);
    bGrad.addColorStop(0, c.light);
    bGrad.addColorStop(0.55, c.main);
    bGrad.addColorStop(1, c.dark);
    ctx.fillStyle = bGrad;
    ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI*2); ctx.fill();

    // Body pattern dots
    ctx.fillStyle = c.dark + '50';
    ctx.beginPath(); ctx.arc(3, 4, R*0.35, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(-4, 5, R*0.2, 0, Math.PI*2); ctx.fill();

    // Specular highlight
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath(); ctx.arc(-4, -4, R*0.35, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(-5, -5, R*0.14, 0, Math.PI*2); ctx.fill();

    // Eyes (front-right side, facing right = angle 0)
    const eyeX = R*0.42;
    const blinkFactor = Math.abs(Math.sin(t*0.6)) < 0.04 ? 0.15 : 1;

    // Eye white
    ctx.fillStyle = '#FAFFF0';
    ctx.beginPath(); ctx.ellipse(eyeX, -R*0.3, 3.5, 3.5*blinkFactor, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(eyeX, R*0.3, 3.5, 3.5*blinkFactor, 0, 0, Math.PI*2); ctx.fill();

    // Iris (team color)
    ctx.fillStyle = c.glow;
    ctx.globalAlpha = 0.85;
    ctx.beginPath(); ctx.ellipse(eyeX + 0.8, -R*0.3, 2, 2*blinkFactor, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(eyeX + 0.8, R*0.3, 2, 2*blinkFactor, 0, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;

    // Pupil
    ctx.fillStyle = '#0A0A20';
    ctx.beginPath(); ctx.ellipse(eyeX + 1.2, -R*0.3, 1.2, 1.2*blinkFactor, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(eyeX + 1.2, R*0.3, 1.2, 1.2*blinkFactor, 0, 0, Math.PI*2); ctx.fill();

    // Eye shine
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(eyeX, -R*0.35, 1, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(eyeX, R*0.25, 1, 0, Math.PI*2); ctx.fill();

    // Nozzle
    const nozzleLen = 14 + charge * 8;
    ctx.fillStyle = c.dark;
    ctx.fillRect(R - 2, -3.5, nozzleLen, 7);
    ctx.fillStyle = c.main;
    ctx.fillRect(R + nozzleLen - 3, -4, 6, 8);
    // Nozzle tip glow when charged
    if (charge > 0) {
      ctx.save();
      ctx.globalAlpha = charge * 0.9;
      ctx.shadowColor = c.glow;
      ctx.shadowBlur = 15;
      ctx.fillStyle = c.glow;
      ctx.beginPath();
      ctx.arc(R + nozzleLen + 3, 0, 4 + charge * 5, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    // Orbiting charge drops
    if (charge > 0.25) {
      const numDrops = Math.floor(3 + charge * 8);
      for (let i = 0; i < numDrops; i++) {
        const orbitR = R + 6 + charge * 12;
        const a = t * 4.5 + (i / numDrops) * Math.PI*2;
        ctx.save();
        ctx.globalAlpha = charge * 0.75;
        ctx.fillStyle = c.light;
        ctx.shadowColor = c.glow;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(Math.cos(a)*orbitR, Math.sin(a)*orbitR, 1.5 + charge*2.5, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      }
    }

    // Special meter ring
    if (this.specialMeter > 0) {
      const ringR = R + 8;
      const pct = this.specialMeter / MAX_SPECIAL;
      ctx.save();
      ctx.strokeStyle = pct >= 1 ? c.glow : c.main;
      ctx.lineWidth = 2.5;
      ctx.globalAlpha = pct >= 1 ? (0.7 + 0.3 * Math.sin(t * 6)) : 0.5;
      if (pct >= 1) { ctx.shadowColor = c.glow; ctx.shadowBlur = 12; }
      ctx.beginPath();
      ctx.arc(0, 0, ringR, -Math.PI/2, -Math.PI/2 + Math.PI*2 * pct);
      ctx.stroke();
      ctx.restore();
    }

    // HP dots (left of character, fixed)
    ctx.restore(); // pop rotation
    ctx.save();
    ctx.translate(px, py);
    for (let i = 0; i < MAX_HP; i++) {
      ctx.fillStyle = i < this.hp ? c.main : 'rgba(255,255,255,0.15)';
      ctx.shadowColor = i < this.hp ? c.glow : 'transparent';
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.arc(-PLAYER_R - 8, -PLAYER_R + i*8 - 4, 3.5, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }
}

// ── Rendering ─────────────────────────────────────────────────────
// Background city (precomputed buildings)
const bgBldgs = [];
(function() {
  // Layered city-pop skyline
  const layers = [
    { count: 14, wMin: 35, wMax: 65, hMin: 60, hMax: 160, yBase: H*0.55 },
    { count: 10, wMin: 50, wMax: 90, hMin: 40, hMax: 100, yBase: H*0.65 },
  ];
  layers.forEach((l, li) => {
    for (let i = 0; i < l.count; i++) {
      const w = l.wMin + Math.random()*(l.wMax-l.wMin);
      const h = l.hMin + Math.random()*(l.hMax-l.hMin);
      bgBldgs.push({
        x: i*(W/l.count) + Math.random()*20,
        y: l.yBase - h, w, h, layer: li,
        wins: Array.from({length: 8}, () => ({
          row: Math.random(), col: Math.random(),
          on: Math.random() > 0.35,
          color: Math.random() < 0.5 ? 0 : 1,
        })),
      });
    }
  });
})();

function drawBackground(t) {
  // Sky gradient
  const sky = ctx.createLinearGradient(0, 0, 0, H*0.7);
  sky.addColorStop(0,   '#04040E');
  sky.addColorStop(0.5, '#0C0820');
  sky.addColorStop(1,   '#180828');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // Stars
  for (let i = 0; i < 80; i++) {
    const sx = ((i*137+11)%W), sy = ((i*97+7)%(H*0.55));
    const tw = 0.3 + 0.7*Math.abs(Math.sin(t*(0.4+i*0.08)+i));
    ctx.globalAlpha = tw * 0.7;
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(sx, sy, i%7===0 ? 2 : 1.5, i%7===0 ? 2 : 1.5);
  }
  ctx.globalAlpha = 1;

  // Moon
  ctx.fillStyle = '#FFF0D0';
  ctx.shadowColor = '#FFE080';
  ctx.shadowBlur = 20;
  ctx.beginPath(); ctx.arc(680, 50, 26, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#FFE890';
  ctx.beginPath(); ctx.arc(680, 50, 18, 0, Math.PI*2); ctx.fill();

  // Neon cross-lights
  [
    {x:60, y:100, col:'rgba(255,15,123,0.06)'},
    {x:W/2, y:120, col:'rgba(0,229,255,0.05)'},
    {x:740, y:100, col:'rgba(255,15,123,0.05)'},
  ].forEach(l => {
    const g = ctx.createRadialGradient(l.x, l.y, 0, l.x, l.y, 120);
    g.addColorStop(0, l.col); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  });

  // Buildings
  bgBldgs.forEach(b => {
    const dark  = b.layer === 0 ? '#10102A' : '#181830';
    const mid   = b.layer === 0 ? '#181832' : '#20203A';
    const light = b.layer === 0 ? '#22224A' : '#28284A';

    ctx.fillStyle = dark;
    ctx.fillRect(b.x+3, b.y+3, b.w, b.h); // shadow
    ctx.fillStyle = mid;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    // Top lighter face
    ctx.fillStyle = light;
    ctx.fillRect(b.x, b.y, b.w, 4);
    ctx.fillRect(b.x, b.y, 2, b.h);

    // Windows
    const wCols = Math.floor(b.w / 14);
    const wRows = Math.floor(b.h / 14);
    b.wins.forEach(w => {
      if (!w.on) return;
      const wr = Math.floor(w.row * wRows), wc = Math.floor(w.col * wCols);
      const wx = b.x + 4 + wc*14, wy = b.y + 4 + wr*14;
      const flicker = Math.sin(t*0.2 + w.row*7 + w.col*5) > -0.97;
      if (!flicker) return;
      ctx.fillStyle = w.color === 0 ? 'rgba(255,220,100,0.55)' : 'rgba(255,100,50,0.45)';
      ctx.fillRect(wx, wy, 8, 6);
    });

    // Rooftop neon
    if (b.layer === 1) {
      const nc = b.x % 2 === 0 ? PAL.A.glow : PAL.B.glow;
      ctx.strokeStyle = nc + '66';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x+b.w, b.y); ctx.stroke();
    }
  });
}

function drawArena() {
  // Outer wall area
  ctx.fillStyle = PAL.bg;
  ctx.fillRect(0, 0, W, ARENA.y);
  ctx.fillRect(0, ARENA.y+ARENA.h, W, H-ARENA.y-ARENA.h);
  ctx.fillRect(0, 0, ARENA.x, H);
  ctx.fillRect(ARENA.x+ARENA.w, 0, W-ARENA.x-ARENA.w, H);

  // Floor
  const floorGrad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, 420);
  floorGrad.addColorStop(0, '#14142C');
  floorGrad.addColorStop(1, '#0C0C1E');
  ctx.fillStyle = floorGrad;
  ctx.fillRect(ARENA.x, ARENA.y, ARENA.w, ARENA.h);

  // Grid
  ctx.strokeStyle = PAL.grid;
  ctx.lineWidth = 1;
  for (let x = ARENA.x; x <= ARENA.x+ARENA.w; x += 32) {
    ctx.beginPath(); ctx.moveTo(x, ARENA.y); ctx.lineTo(x, ARENA.y+ARENA.h); ctx.stroke();
  }
  for (let y = ARENA.y; y <= ARENA.y+ARENA.h; y += 32) {
    ctx.beginPath(); ctx.moveTo(ARENA.x, y); ctx.lineTo(ARENA.x+ARENA.w, y); ctx.stroke();
  }

  // Arena border glow
  ctx.strokeStyle = 'rgba(80,80,200,0.4)';
  ctx.lineWidth = 2;
  ctx.strokeRect(ARENA.x+1, ARENA.y+1, ARENA.w-2, ARENA.h-2);

  // Corner marks
  const cm = 20;
  [
    [ARENA.x+4, ARENA.y+4],
    [ARENA.x+ARENA.w-4, ARENA.y+4],
    [ARENA.x+4, ARENA.y+ARENA.h-4],
    [ARENA.x+ARENA.w-4, ARENA.y+ARENA.h-4],
  ].forEach(([cx,cy]) => {
    ctx.strokeStyle = 'rgba(120,120,255,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx-cm, cy); ctx.lineTo(cx, cy); ctx.lineTo(cx, cy+Math.sign(cy-H/2)*cm); ctx.stroke();
  });

  // Pillars (after paint, so they cover it)
  for (const p of PILLARS) {
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(p.x+5, p.y+5, p.w, p.h);

    // Bottom face (darkest)
    ctx.fillStyle = PAL.wallD;
    ctx.fillRect(p.x, p.y, p.w, p.h);

    // Front faces
    ctx.fillStyle = PAL.wall;
    ctx.fillRect(p.x, p.y, p.w, p.h - 4);

    // Top face (lighter, HD-2D style top-down highlight)
    ctx.fillStyle = PAL.wallL;
    ctx.fillRect(p.x, p.y, p.w, 5);
    ctx.fillRect(p.x, p.y, 4, p.h);

    // Grid detail on pillar
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    for (let i = 0; i < Math.floor(p.w/16); i++) {
      ctx.fillRect(p.x + i*16, p.y, 1, p.h);
    }
    for (let i = 0; i < Math.floor(p.h/16); i++) {
      ctx.fillRect(p.x, p.y + i*16, p.w, 1);
    }

    // Neon border
    ctx.strokeStyle = 'rgba(80,80,200,0.5)';
    ctx.lineWidth = 1;
    ctx.strokeRect(p.x+0.5, p.y+0.5, p.w-1, p.h-1);
  }
}

function drawPaint() {
  ctx.save();
  // Clip to arena floor (not over pillars or outside arena)
  ctx.beginPath();
  ctx.rect(ARENA.x, ARENA.y, ARENA.w, ARENA.h);
  for (const p of PILLARS) {
    // Subtract pillars from clip (reverse winding)
    ctx.rect(p.x, p.y + p.h, p.w, -p.h);
  }
  // Just draw full paint canvas — pillars are drawn on top anyway
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = 0.88;
  ctx.drawImage(paintCanvas, 0, 0);
  // Neon glow pass
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.18;
  ctx.drawImage(paintCanvas, 0, 0);
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    const a = Math.max(0, p.life / p.maxLife);
    ctx.save();
    ctx.globalAlpha = a * 0.9;
    if (p.glow) { ctx.shadowColor = p.glow; ctx.shadowBlur = 10; }
    ctx.fillStyle = p.color;
    if (p.square) {
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot || 0);
      ctx.fillRect(-p.r/2, -p.r/2, p.r, p.r);
    } else {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

function drawSpecialRings() {
  for (const e of specialEffects) {
    const c = PAL[e.team];
    ctx.save();
    ctx.globalAlpha = e.alpha;
    ctx.shadowColor = c.glow;
    ctx.shadowBlur = 25;
    ctx.strokeStyle = c.glow;
    ctx.lineWidth = 6 * e.alpha;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI*2); ctx.stroke();
    ctx.lineWidth = 3 * e.alpha;
    ctx.strokeStyle = c.light;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r2, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
}

// ── HUD ───────────────────────────────────────────────────────────
function drawHUD(pA, pB, percents, timeLeft) {
  const t = gTime;

  // ── Timer ──
  const tx = W/2, ty = 14;
  ctx.fillStyle = 'rgba(8,8,22,0.8)';
  roundRect(ctx, tx-52, ty-2, 104, 40, 8); ctx.fill();
  const mins = Math.floor(timeLeft/60), secs = Math.floor(timeLeft%60);
  ctx.fillStyle = timeLeft < 30 ? (Math.floor(t*4)%2?'#FF4444':'#FF8888') : PAL.gold;
  ctx.shadowColor = timeLeft < 30 ? '#FF0000' : PAL.gold;
  ctx.shadowBlur = 12;
  ctx.font = 'bold 30px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`${mins}:${secs.toString().padStart(2,'0')}`, tx, ty + 26);
  ctx.shadowBlur = 0;

  // ── Coverage bars ──
  const bx = 110, bw = W - 220, bh = 16, by = 10;
  ctx.fillStyle = '#111128';
  roundRect(ctx, bx-2, by-2, bw+4, bh+4, 4); ctx.fill();

  const aW = bw * percents.a/100;
  if (aW > 0) {
    const ag = ctx.createLinearGradient(bx, 0, bx+aW, 0);
    ag.addColorStop(0, PAL.A.dark); ag.addColorStop(1, PAL.A.main);
    ctx.fillStyle = ag;
    ctx.shadowColor = PAL.A.glow; ctx.shadowBlur = 8;
    ctx.fillRect(bx, by, aW, bh);
  }
  const bW = bw * percents.b/100;
  if (bW > 0) {
    const bg2 = ctx.createLinearGradient(bx+bw-bW, 0, bx+bw, 0);
    bg2.addColorStop(0, PAL.B.main); bg2.addColorStop(1, PAL.B.dark);
    ctx.fillStyle = bg2;
    ctx.shadowColor = PAL.B.glow; ctx.shadowBlur = 8;
    ctx.fillRect(bx+bw-bW, by, bW, bh);
  }
  ctx.shadowBlur = 0;

  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 1;
  roundRect(ctx, bx-2, by-2, bw+4, bh+4, 4); ctx.stroke();

  // ── Team A info (bottom-left) ──
  drawPlayerHUD(pA,  20, H-60, 'left');
  // ── Team B info (bottom-right) ──
  drawPlayerHUD(pB, W-20, H-60, 'right');

  // ── Coverage % labels ──
  ctx.fillStyle = PAL.A.light;
  ctx.font = 'bold 11px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`${percents.a.toFixed(1)}%`, bx+3, by+bh-3);
  ctx.fillStyle = PAL.B.light;
  ctx.textAlign = 'right';
  ctx.fillText(`${percents.b.toFixed(1)}%`, bx+bw-3, by+bh-3);

  // ── Controls hint ──
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.font = '10px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('WASD: 移動　マウス: 照準　LB: 射撃/長押しでチャージ　RB or E: 必殺技', W/2, H-6);
}

function drawPlayerHUD(player, x, y, side) {
  if (!player) return;
  const c = PAL[player.team];
  const isLeft = side === 'left';

  ctx.save();
  ctx.fillStyle = 'rgba(8,8,22,0.75)';
  const boxW = 155, boxH = 50;
  const bx = isLeft ? x : x - boxW;
  roundRect(ctx, bx, y-4, boxW, boxH, 8); ctx.fill();

  // Team label
  ctx.fillStyle = c.main;
  ctx.shadowColor = c.glow; ctx.shadowBlur = 8;
  ctx.font = 'bold 13px monospace';
  ctx.textAlign = isLeft ? 'left' : 'right';
  ctx.fillText(`TEAM ${player.team}`, isLeft ? bx+8 : x-8, y+12);
  ctx.shadowBlur = 0;

  // HP hearts
  for (let i = 0; i < MAX_HP; i++) {
    const hx = isLeft ? bx + 8 + i*18 : x - 8 - (MAX_HP-1-i)*18 - 14;
    ctx.fillStyle = i < player.hp ? c.main : 'rgba(255,255,255,0.12)';
    ctx.shadowColor = i < player.hp ? c.glow : 'transparent';
    ctx.shadowBlur = i < player.hp ? 8 : 0;
    ctx.fillText('♥', hx, y + 28);
  }
  ctx.shadowBlur = 0;

  // Ammo dots
  for (let i = 0; i < MAX_AMMO; i++) {
    const filled = player.ammo >= (i + 1) - 0.1;
    const hx = isLeft ? bx + 8 + i*17 : x - 8 - (MAX_AMMO-1-i)*17 - 6;
    ctx.fillStyle = filled ? c.main : 'rgba(255,255,255,0.1)';
    ctx.shadowColor = filled ? c.glow : 'transparent';
    ctx.shadowBlur = filled ? 6 : 0;
    ctx.beginPath(); ctx.arc(hx, y+42, 4, 0, Math.PI*2); ctx.fill();
  }
  ctx.shadowBlur = 0;

  // Special label
  const spPct = player.specialMeter / MAX_SPECIAL;
  const spColor = spPct >= 1 ? c.glow : c.dark;
  ctx.strokeStyle = spColor;
  ctx.lineWidth = 2;
  ctx.shadowColor = spPct >= 1 ? c.glow : 'transparent';
  ctx.shadowBlur = spPct >= 1 ? 10 : 0;
  const spW = 130, spH = 5;
  const spx = isLeft ? bx + 12 : x - 12 - spW;
  const spy = y + 15;
  ctx.fillStyle = '#111128';
  ctx.fillRect(spx, spy, spW, spH);
  const sg = ctx.createLinearGradient(spx, 0, spx+spW, 0);
  sg.addColorStop(0, c.dark); sg.addColorStop(1, c.glow);
  ctx.fillStyle = sg;
  ctx.fillRect(spx, spy, spW * spPct, spH);
  ctx.strokeRect(spx, spy, spW, spH);
  ctx.shadowBlur = 0;

  // "SPECIAL!" label when full
  if (spPct >= 1 && Math.floor(gTime*4)%2===0) {
    ctx.fillStyle = c.glow;
    ctx.shadowColor = c.glow; ctx.shadowBlur = 12;
    ctx.font = 'bold 11px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('★SPECIAL★', spx + spW/2, spy - 2);
    ctx.shadowBlur = 0;
  }

  ctx.restore();
}

// ── Title screen ──────────────────────────────────────────────────
function drawTitle(t) {
  drawBackground(t);

  // Top-down arena preview behind glass
  ctx.save();
  ctx.globalAlpha = 0.35;
  drawArena();
  ctx.restore();

  // Dark overlay
  ctx.fillStyle = 'rgba(4,4,14,0.65)';
  ctx.fillRect(0, 0, W, H);

  // Logo backdrop
  ctx.fillStyle = 'rgba(8,8,25,0.88)';
  roundRect(ctx, W/2-250, H/2-130, 500, 260, 18); ctx.fill();

  // Neon border (dual color)
  ctx.save();
  ctx.strokeStyle = PAL.A.main;
  ctx.lineWidth = 2.5;
  ctx.shadowColor = PAL.A.glow; ctx.shadowBlur = 20;
  roundRect(ctx, W/2-250, H/2-130, 500, 260, 18); ctx.stroke();
  ctx.strokeStyle = PAL.B.main;
  ctx.shadowColor = PAL.B.glow;
  ctx.globalAlpha = 0.5;
  roundRect(ctx, W/2-246, H/2-126, 492, 252, 16); ctx.stroke();
  ctx.restore();

  // Title text
  const pulse = 1 + 0.035*Math.sin(t*2.8);
  ctx.save();
  ctx.translate(W/2, H/2 - 55);
  ctx.scale(pulse, pulse);
  const tg = ctx.createLinearGradient(-210, -45, 210, 5);
  tg.addColorStop(0,   PAL.A.light);
  tg.addColorStop(0.35,PAL.A.main);
  tg.addColorStop(0.5, PAL.gold);
  tg.addColorStop(0.65,PAL.B.main);
  tg.addColorStop(1,   PAL.B.light);
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.font = 'bold 54px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('ChromaSplash', 3, 3);
  ctx.fillStyle = tg;
  ctx.shadowColor = PAL.A.glow; ctx.shadowBlur = 25;
  ctx.fillText('ChromaSplash', 0, 0);
  ctx.restore();

  // v2 badge
  ctx.fillStyle = PAL.B.main;
  ctx.font = 'bold 13px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('v2  —  TOP-DOWN NEON EDITION', W/2, H/2-10);

  // Two characters previewing on title
  if (gPlayers.length >= 2) {
    gPlayers[0].x = W/2 - 80; gPlayers[0].y = H/2 + 38;
    gPlayers[0].angle = -0.3; gPlayers[0].animTime = t;
    gPlayers[0].chargeLevel = 0; gPlayers[0].specialMeter = 80;
    gPlayers[1].x = W/2 + 80; gPlayers[1].y = H/2 + 38;
    gPlayers[1].angle = Math.PI + 0.3; gPlayers[1].animTime = t + 0.8;
    gPlayers[1].chargeLevel = 0; gPlayers[1].specialMeter = 100;
    gPlayers[0].dead = false; gPlayers[1].dead = false;
    gPlayers[0].draw(); gPlayers[1].draw();
  }

  // Press space
  if (Math.floor(t*2)%2) {
    ctx.fillStyle = PAL.gold;
    ctx.shadowColor = PAL.gold; ctx.shadowBlur = 15;
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('▶  PRESS SPACE TO START  ◀', W/2, H/2+92);
    ctx.shadowBlur = 0;
  }
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.font = '11px monospace';
  ctx.fillText('WASD: 移動　マウス: 照準/射撃/チャージ　RB or E: 必殺技（溜め技）', W/2, H/2 + 113);
  ctx.fillText('vs AI  ·  制限時間3分  ·  塗った面積が多い方の勝ち！', W/2, H/2 + 128);
}

function drawCountdown(cd) {

// ── Result screen ─────────────────────────────────────────────────
function drawResult(percents, t) {
  drawBackground(t);

  ctx.save();
  ctx.globalAlpha = 0.5;
  ctx.drawImage(paintCanvas, 0, 0);
  ctx.restore();

  ctx.fillStyle = 'rgba(4,4,14,0.72)';
  ctx.fillRect(0, 0, W, H);

  const winTeam = percents.a >= percents.b ? 'A' : 'B';
  const c = PAL[winTeam];

  // Backdrop
  ctx.fillStyle = 'rgba(8,8,25,0.9)';
  roundRect(ctx, W/2-270, H/2-150, 540, 300, 20); ctx.fill();

  ctx.strokeStyle = c.glow;
  ctx.lineWidth = 3;
  ctx.shadowColor = c.glow; ctx.shadowBlur = 30;
  roundRect(ctx, W/2-270, H/2-150, 540, 300, 20); ctx.stroke();
  ctx.shadowBlur = 0;

  // Header
  ctx.fillStyle = PAL.gold;
  ctx.font = 'bold 15px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('◆  BATTLE OVER  ◆', W/2, H/2-120);

  // Winner
  const pp = 1 + 0.04*Math.sin(t*3.5);
  ctx.save();
  ctx.translate(W/2, H/2-60);
  ctx.scale(pp, pp);
  const wg = ctx.createLinearGradient(-200,-35,200,5);
  wg.addColorStop(0, c.light); wg.addColorStop(0.5, c.glow); wg.addColorStop(1, c.light);
  ctx.fillStyle = wg;
  ctx.shadowColor = c.glow; ctx.shadowBlur = 35;
  ctx.font = 'bold 52px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`TEAM ${winTeam} WIN!`, 0, 0);
  ctx.restore();

  // Coverage bar
  const bx = W/2-210, bw = 420, bh = 30, by = H/2+14;
  ctx.fillStyle = '#111128';
  roundRect(ctx, bx-2, by-2, bw+4, bh+4, 6); ctx.fill();

  if (percents.a > 0) {
    const aW = bw*percents.a/100;
    const ag = ctx.createLinearGradient(bx,0,bx+aW,0);
    ag.addColorStop(0,PAL.A.dark); ag.addColorStop(1,PAL.A.main);
    ctx.fillStyle=ag; ctx.shadowColor=PAL.A.glow; ctx.shadowBlur=8;
    ctx.fillRect(bx,by,aW,bh);
  }
  if (percents.b > 0) {
    const bW2 = bw*percents.b/100;
    const bg2 = ctx.createLinearGradient(bx+bw-bW2,0,bx+bw,0);
    bg2.addColorStop(0,PAL.B.main); bg2.addColorStop(1,PAL.B.dark);
    ctx.fillStyle=bg2; ctx.shadowColor=PAL.B.glow; ctx.shadowBlur=8;
    ctx.fillRect(bx+bw-bW2,by,bW2,bh);
  }
  ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.lineWidth=1;
  roundRect(ctx,bx-2,by-2,bw+4,bh+4,6); ctx.stroke();

  ctx.fillStyle=PAL.A.light; ctx.font='bold 13px monospace'; ctx.textAlign='left';
  ctx.fillText(`TEAM A  ${percents.a.toFixed(1)}%`, bx+6, by+20);
  ctx.fillStyle=PAL.B.light; ctx.textAlign='right';
  ctx.fillText(`${percents.b.toFixed(1)}%  TEAM B`, bx+bw-6, by+20);

  // Blink restart
  if (Math.floor(t*2)%2) {
    ctx.fillStyle=PAL.gold; ctx.shadowColor=PAL.gold; ctx.shadowBlur=12;
    ctx.font='bold 15px monospace'; ctx.textAlign='center';
    ctx.fillText('▶  PRESS SPACE TO PLAY AGAIN  ◀', W/2, H/2+110);
    ctx.shadowBlur=0;
  }
}

// ── Utilities ─────────────────────────────────────────────────────
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}

// ── Game state ────────────────────────────────────────────────────
let gState = 'title';  // title | countdown | play | result
let gTime = 0;
let gameTimer = GAME_SEC;
let cdVal = 3, cdTimer = 0;
let resultPercents = { a:0, b:0 };
let gPlayers = [];
let cachedPercents = { a:0, b:0 };
let percentTimer = 0;

function createPlayers() {
  gPlayers = [
    new Player(ARENA.x + 90,  ARENA.y + ARENA.h/2, 'A', false),
    new Player(ARENA.x + ARENA.w - 90, ARENA.y + ARENA.h/2, 'B', true),
  ];
}

function resetPaint() {
  pCtx.clearRect(0,0,W,H);
  tileOwner = Array.from({length:OWN_ROWS}, () => new Uint8Array(OWN_COLS));
  pendingSplats.length = 0;
  specialEffects.length = 0;
  projectiles.length = 0;
  particles.length = 0;
}

function initTitle() {
  gState = 'title';
  stopBGM();
  createPlayers();
  resetPaint();
}

function startGame() {
  gState = 'countdown';
  cdVal = 3; cdTimer = 1;
  gameTimer = GAME_SEC;
  createPlayers();
  resetPaint();
  cachedPercents = { a:0, b:0 };
  // Initial paint at spawn
  paintCircle(gPlayers[0].x, gPlayers[0].y, 'A', 45);
  paintCircle(gPlayers[1].x, gPlayers[1].y, 'B', 45);
}

function endGame() {
  gState = 'result';
  resultPercents = getPaintPercents();
  stopBGM();
  sfx('win', resultPercents.a >= resultPercents.b ? 'A' : 'B');
  for (let i=0; i<10; i++) {
    setTimeout(() => spawnConfetti(Math.random()*W, H*0.25, 18), i*150);
  }
}

function onSpacePress() {
  if (gState==='title') startGame();
  else if (gState==='result') initTitle();
}

// ── Main loop ──────────────────────────────────────────────────────
let lastT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - lastT)/1000, 0.05);
  lastT = now;
  gTime += dt;
  const t = gTime;

  ctx.clearRect(0,0,W,H);

  if (gState === 'title') {
    drawTitle(t);
    return;
  }

  if (gState === 'countdown') {
    drawBackground(t);
    drawArena();
    drawPaint();
    // Draw arena again to put pillars on top of paint
    for (const p of PILLARS) {
      ctx.fillStyle = PAL.wallD;
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = PAL.wall;
      ctx.fillRect(p.x, p.y, p.w, p.h - 4);
      ctx.fillStyle = PAL.wallL;
      ctx.fillRect(p.x, p.y, p.w, 5);
      ctx.fillRect(p.x, p.y, 4, p.h);
    }
    gPlayers.forEach(p => p.draw());
    drawCountdown(cdVal);

    cdTimer -= dt;
    if (cdTimer <= 0) {
      cdVal--;
      cdTimer = 1;
      if (cdVal < 0) { gState = 'play'; startBGM(); }
    }
    return;
  }

  if (gState === 'play') {
    gameTimer -= dt;
    if (gameTimer <= 0) { gameTimer = 0; endGame(); return; }

    // Update
    updateSplats(dt);
    updateSpecialEffects(dt);

    gPlayers[0].update(dt, gPlayers[1]);
    gPlayers[1].update(dt, gPlayers[0]);

    // Cross-death special gain
    for (const pl of gPlayers) {
      if (pl.dead && pl.respawnTimer > RESPAWN_SEC - 0.1) {
        const opp = gPlayers.find(p => p !== pl);
        if (opp) opp.specialMeter = Math.min(MAX_SPECIAL, opp.specialMeter + SPECIAL_GAIN_HIT);
      }
    }

    for (let i=projectiles.length-1; i>=0; i--) {
      projectiles[i].update(dt, gPlayers);
      if (projectiles[i].dead) projectiles.splice(i,1);
    }

    updateParticles(dt);

    percentTimer += dt;
    if (percentTimer > 0.8) {
      cachedPercents = getPaintPercents();
      percentTimer = 0;
    }

    // Render
    drawBackground(t);
    drawArena();   // floor + outer walls
    drawPaint();   // paint canvas (before pillars)

    // Redraw pillars on top of paint
    ctx.save();
    for (const p of PILLARS) {
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(p.x+5, p.y+5, p.w, p.h);
      ctx.fillStyle = PAL.wallD;
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = PAL.wall;
      ctx.fillRect(p.x, p.y, p.w, p.h-4);
      ctx.fillStyle = PAL.wallL;
      ctx.fillRect(p.x, p.y, p.w, 5);
      ctx.fillRect(p.x, p.y, 4, p.h);
      ctx.strokeStyle = 'rgba(80,80,200,0.4)';
      ctx.lineWidth = 1;
      ctx.strokeRect(p.x+0.5, p.y+0.5, p.w-1, p.h-1);
    }
    ctx.restore();

    // Entities
    drawSpecialRings();
    for (const p of projectiles) p.draw();
    gPlayers.forEach(p => p.draw());
    drawParticles();

    // HUD
    drawHUD(gPlayers[0], gPlayers[1], cachedPercents, gameTimer);

    // Time warning
    if (gameTimer < 30 && Math.floor(t*4)%2===0) {
      ctx.fillStyle = 'rgba(255,40,40,0.07)';
      ctx.fillRect(0,0,W,H);
    }
    return;
  }

  if (gState === 'result') {
    updateParticles(dt);
    drawResult(resultPercents, t);
    drawParticles();
  }
}

// ── Init ───────────────────────────────────────────────────────────
initTitle();
requestAnimationFrame(ts => { lastT = ts; requestAnimationFrame(frame); });
</script>
